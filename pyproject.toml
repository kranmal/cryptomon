[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptomon"
version = "0.1.0"
description = "Transparent desktop crypto portfolio monitor: add your coins, see live value and 24h change"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5"]

[project.scripts]
cryptomon = "cryptomon.app:main"

[tool.setuptools.packages.find]
where = ["src"]
